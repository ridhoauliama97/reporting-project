name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (typecheck + vite build)
        run: npm run build

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: lint-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute app version
        id: version
        run: echo "version=$(node dashboard/scripts/version.mjs)" >> "$GITHUB_OUTPUT"

      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel@latest deploy --prod --yes --build-env APP_VERSION=${{ steps.version.outputs.version }}

  deploy-api:
    name: Deploy Auth API to Vercel
    runs-on: ubuntu-latest
    needs: lint-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Deploy production
        if: ${{ secrets.API_DATABASE_URL != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
        run: npx vercel@latest deploy --prod --yes --cwd server \
          --env DATABASE_URL=${{ secrets.API_DATABASE_URL }} \
          --env BETTER_AUTH_SECRET=${{ secrets.API_BETTER_AUTH_SECRET }} \
          --env BETTER_AUTH_URL=https://reporting-api.vercel.app \
          --env BETTER_AUTH_TRUSTED_ORIGINS=https://database-report-gsu.vercel.app \
          --env BETTER_AUTH_REDIRECT_URL=https://database-report-gsu.vercel.app