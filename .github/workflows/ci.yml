name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (typecheck + vite build)
        run: npm run build

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: lint-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute app version
        id: version
        run: echo "version=$(node dashboard/scripts/version.mjs)" >> "$GITHUB_OUTPUT"

      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel@latest deploy --prod --yes --build-env APP_VERSION=${{ steps.version.outputs.version }}

  deploy-api:
    name: Deploy Auth API to Vercel
    runs-on: ubuntu-latest
    needs: lint-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      API_DATABASE_URL: ${{ secrets.API_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Create project (idempotent)
        if: env.API_DATABASE_URL != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          npx vercel@latest project add reporting-api --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" || true

      - name: Link project
        if: env.API_DATABASE_URL != ''
        working-directory: server
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: npx vercel@latest link --yes --project reporting-api --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" || true

      - name: Set environment variables
        if: env.API_DATABASE_URL != ''
        working-directory: server
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          API_BETTER_AUTH_SECRET: ${{ secrets.API_BETTER_AUTH_SECRET }}
          API_DATABASE_URL: ${{ secrets.API_DATABASE_URL }}
        run: |
          echo "$$API_DATABASE_URL" | npx vercel@latest env add DATABASE_URL production --force --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" || true
          echo "${API_BETTER_AUTH_SECRET:-dev-secret-change-before-prod}" | npx vercel@latest env add BETTER_AUTH_SECRET production --force --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" || true
          echo "https://reporting-api.vercel.app" | npx vercel@latest env add BETTER_AUTH_URL production --force --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" || true
          echo "https://database-report-gsu.vercel.app" | npx vercel@latest env add BETTER_AUTH_TRUSTED_ORIGINS production --force --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" || true
          echo "https://database-report-gsu.vercel.app" | npx vercel@latest env add BETTER_AUTH_REDIRECT_URL production --force --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" || true

      - name: Deploy production
        if: env.API_DATABASE_URL != ''
        working-directory: server
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"